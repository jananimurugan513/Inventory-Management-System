<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Management System | Home</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Navigation Bar */
    nav {
      width: 100%;
      background-color: #111;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 60px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .profile-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #ffcc00;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #111;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .profile-icon:hover {
      transform: scale(1.1);
      background-color: white;
      color: #e6427a;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
      transition: 0.3s;
    }

    .menu a:hover {
      color: #ffcc00;
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #f15b2a, #e6427a);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 42px;
      letter-spacing: 1px;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
      max-width: 600px;
      line-height: 1.6;
    }

    .btn {
      background-color: white;
      color: #e6427a;
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .btn:hover {
      background-color: #ffcc00;
      color: black;
      transform: scale(1.05);
    }

    /* Cards Section */
    .features {
      background-color: #fff;
      padding: 80px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 30px;
    }

    .feature-box {
      background: linear-gradient(135deg, #f15b2a, #e6427a);
      color: white;
      width: 300px;
      padding: 30px 20px;
      border-radius: 15px;
      text-align: center;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .feature-box:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .feature-box h3 {
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: 600;
    }

    .feature-box p {
      font-size: 15px;
      line-height: 1.5;
    }

    footer {
      background-color: #111;
      color: #fff;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 32px; }
      .hero p { font-size: 16px; }
      nav { padding: 15px 25px; }
      .menu a { margin: 0 10px; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-left">
      <a href="profile.html">
        <div class="profile-icon">👤</div>
      </a>
      <div class="logo">Inventory Management</div>
    </div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="add_item.html">Add Products</a>
      <a href="view_items.html">View Products</a>
      <a href="report.html">Reports</a>
      <a href="login.html">Logout</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <h1>CHOOSE YOUR INVENTORY STYLE!</h1>
    <p>
      Manage your stock, sales, and reports efficiently with our modern Inventory Management System.
      
    </p>
    <a href="view_items.html" class="btn">Get Started</a>
  </section>

  <!-- Footer -->
  <footer>
    © 2025 Inventory Management System. All rights reserved.
  </footer>

</body>
</html>
