<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Inventory Management System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #f15b2a, #e6427a);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #333;
    }

    /* Navbar */
    nav {
      width: 100%;
      background-color: #111;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 70px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      margin: 0 18px;
      font-weight: 500;
      transition: 0.3s;
    }

    .menu a:hover {
      color: #ffcc00;
    }

    /* Profile Section */
    .profile-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 120px;
      padding: 50px 20px;
    }

    .profile-card {
      background-color: #fff;
      width: 1000px;
      height: 600px;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
      display: flex;
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .profile-left {
      background: linear-gradient(135deg, #f15b2a, #e6427a);
      color: white;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 25px;
    }

    .profile-left img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 5px solid white;
      margin-bottom: 25px;
    }

    .profile-left h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .profile-left p {
      font-size: 16px;
      opacity: 0.9;
    }

    .profile-right {
      flex: 2;
      padding: 60px 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .profile-right h3 {
      margin-bottom: 25px;
      color: #e6427a;
      font-size: 26px;
      border-bottom: 3px solid #e6427a;
      display: inline-block;
      padding-bottom: 6px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .info-row p {
      font-size: 18px;
      margin: 6px 0;
    }

    .info-label {
      font-weight: 600;
      color: #444;
    }

    .btn-container {
      text-align: right;
      margin-top: 40px;
    }

    .btn {
      background: linear-gradient(135deg, #f15b2a, #e6427a);
      color: white;
      padding: 14px 35px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: 0.3s;
      margin-left: 10px;
    }

    .btn:hover {
      background: #ffcc00;
      color: #111;
      transform: scale(1.05);
    }

    footer {
      background-color: #111;
      color: #fff;
      text-align: center;
      padding: 18px;
      font-size: 15px;
    }

    @media (max-width: 900px) {
      .profile-card {
        flex-direction: column;
        width: 90%;
        height: auto;
      }
      .profile-right {
        padding: 40px 30px;
      }
      .info-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .btn-container {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">Inventory Management</div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="add_item.html">Add Item</a>
      <a href="view_items.html">View Items</a>
      <a href="report.html">Reports</a>
      <a href="login.html">Logout</a>
    </div>
  </nav>

  <!-- Profile Section -->
  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-left">
        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile Picture">
        <h2 id="profileName">User Name</h2>
        <p id="profileRole">User</p>
      </div>

      <div class="profile-right">
        <h3>Personal Information</h3>

        <div class="info-row">
          <p><span class="info-label">Full Name:</span> <span id="fullname"></span></p>
          <p><span class="info-label">Gender:</span> <span id="gender"></span></p>
        </div>
        <div class="info-row">
          <p><span class="info-label">Email:</span> <span id="email"></span></p>
          <p><span class="info-label">Phone:</span> <span id="phone"></span></p>
        </div>
        <div class="info-row">
          <p><span class="info-label">Address:</span> <span id="address"></span></p>
          <p><span class="info-label">Joined On:</span> <span id="joined"></span></p>
        </div>

        <div class="btn-container">
          <button class="btn" onclick="editProfile()">Edit Profile</button>
          <button class="btn" onclick="goToDashboard()">Go to Dashboard</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 Inventory Management System. All rights reserved.
  </footer>

  <script>
    const userData = JSON.parse(localStorage.getItem('userProfile'));

    if (userData) {
      document.getElementById('profileName').textContent = userData.fullname;
      document.getElementById('fullname').textContent = userData.fullname;
      document.getElementById('gender').textContent = userData.gender;
      document.getElementById('email').textContent = userData.email;
      document.getElementById('phone').textContent = userData.phone;
      document.getElementById('address').textContent = userData.address;
      document.getElementById('joined').textContent = userData.joined;
    } else {
      alert('⚠️ No profile found! Please create one.');
      window.location.href = 'edit_profile.html';
    }

    function editProfile() {
      window.location.href = 'edit_profile.html';
    }

    function goToDashboard() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
