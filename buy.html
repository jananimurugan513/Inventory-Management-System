<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Product | Inventory Management System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      /* 🌀 Multicolor gradient background */
      background: linear-gradient(135deg, #ff6b6b, #f7b733, #45cafc, #5f27cd);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
      color: #22afc8;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h2 {
      color: #0ea8a1;
      margin-bottom: 25px;
      font-size: 28px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    form {
      background: rgba(0, 0, 0, 0.55);
      padding: 40px;
      border-radius: 25px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      transition: 0.3s ease;
    }

    form:hover {
      transform: scale(1.02);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
    }

    label {
      font-size: 15px;
      font-weight: 500;
      color: #ffea00;
      margin-bottom: 6px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.15);
      color: #e8eef1;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 8px #ffcc00;
    }

    input::placeholder, textarea::placeholder {
      color: #ffffff;
    }

    textarea {
      resize: none;
      height: 90px;
    }

    button {
      background: linear-gradient(90deg, #ffcc00, #ff2975);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 12px 25px;
      width: 100%;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.4s ease;
    }

    button:hover {
      background: linear-gradient(90deg, #407ec0, #00ffcc);
      color: #38c0d2;
      transform: scale(1.05);
    }

    .back-link {
      margin-top: 25px;
      text-decoration: none;
      color: #eef2f2;
      font-weight: 600;
      transition: 0.3s;
    }

    .back-link:hover {
      color: #ffcc00;
      text-shadow: 0 0 8px #edf2f3;
    }

    #upiField {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-5px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>

  <h2>🛒 Buy Product</h2>

  <form id="buyForm">
    <label>Product Name</label>
    <input type="text" id="productName" readonly />

    <label>Your Name</label>
    <input type="text" id="customerName" placeholder="Enter your name" required />

    <label>Email</label>
    <input type="email" id="customerEmail" placeholder="Enter your email" required />

    <label>Address</label>
    <textarea id="customerAddress" placeholder="Enter your address" required></textarea>

    <label>Payment Method</label>
    <select id="paymentMethod" required>
      <option value="">-- Select Payment --</option>
      <option value="upi">UPI</option>
      <option value="cod">Cash on Delivery</option>
    </select>

    <div id="upiField">
      <label>Enter UPI ID / Number</label>
      <input type="text" id="upiId" placeholder="example@upi or 9876543210" />
    </div>

    <button type="submit">Confirm Purchase</button>
  </form>

  <a href="view_items.html" class="back-link">← Back to Products</a>

  <script>
    const selectedProduct = JSON.parse(localStorage.getItem('selectedProduct'));
    const productNameInput = document.getElementById('productName');
    const paymentMethod = document.getElementById('paymentMethod');
    const upiField = document.getElementById('upiField');

    if (selectedProduct) {
      productNameInput.value = selectedProduct.name;
    }

    paymentMethod.addEventListener('change', () => {
      if (paymentMethod.value === 'upi') {
        upiField.style.display = 'block';
        document.getElementById('upiId').required = true;
      } else {
        upiField.style.display = 'none';
        document.getElementById('upiId').required = false;
      }
    });

    const form = document.getElementById('buyForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const name = document.getElementById('customerName').value;
      const method = paymentMethod.value === 'upi' ? 
        `UPI (${document.getElementById('upiId').value})` : 
        'Cash on Delivery';

      alert(`✅ Order confirmed for ${productNameInput.value}!\nPayment Method: ${method}\nThank you, ${name}.`);

      form.reset();
      localStorage.removeItem('selectedProduct');
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
