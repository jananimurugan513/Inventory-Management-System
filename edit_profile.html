<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile | Inventory Management</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f15b2a, #e6427a);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .edit-box {
      background: #fff;
      width: 550px;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 {
      text-align: center;
      color: #e6427a;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 12px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: linear-gradient(135deg, #f15b2a, #e6427a);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 12px 25px;
      margin-top: 20px;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ffcc00;
      color: #111;
    }
  </style>
</head>
<body>

  <div class="edit-box">
    <h2>Edit Profile</h2>
    <form id="editProfileForm">
      <label>Full Name</label>
      <input type="text" id="fullname" required>

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Other">Other</option>
      </select>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Phone</label>
      <input type="text" id="phone" maxlength="10" required>

      <label>Address</label>
      <textarea id="address" rows="3"></textarea>

      <label>Joined On</label>
      <input type="date" id="joined" required>

      <button type="submit">Save Profile</button>
    </form>
  </div>

  <script>
    const existing = JSON.parse(localStorage.getItem('userProfile'));
    if (existing) {
      document.getElementById('fullname').value = existing.fullname || "";
      document.getElementById('gender').value = existing.gender || "";
      document.getElementById('email').value = existing.email || "";
      document.getElementById('phone').value = existing.phone || "";
      document.getElementById('address').value = existing.address || "";
      document.getElementById('joined').value = existing.joined || "";
    }

    document.getElementById('editProfileForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const profile = {
        fullname: document.getElementById('fullname').value,
        gender: document.getElementById('gender').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        joined: document.getElementById('joined').value
      };

      localStorage.setItem('userProfile', JSON.stringify(profile));
      alert('✅ Profile updated successfully!');
      window.location.href = 'profile.html';
    });
  </script>
</body>
</html>
